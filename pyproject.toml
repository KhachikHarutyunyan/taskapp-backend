[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "test"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.116.1,<0.117.0)",
    "sqlalchemy (>=2.0.42,<3.0.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "bcrypt (==4.0.1)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "email-validator (>=2.2.0,<3.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "httpx (>=0.28.1,<0.29.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "slowapi (>=0.1.9,<0.2.0)",
]

[tool.poetry]
packages = [{include = "api", from = "src"}]


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
ruff = "^0.12.7"
isort = "^6.0.1"
black = "^25.1.0"
pytest-cov = "^6.2.1"
pytest-asyncio = "^1.1.0"
pytest-mock = "^3.14.1"

# Ruff
[tool.ruff]
line-length = 88
target-version = "py311"
# lint.extend-select = ["I", "B"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"**/models/*.py" = ["F821", "F401"]
"**/schemas/*.py" = ["F821"]
"**/utils/__init__.py" = ["F401"]

# Black
[tool.black]
line-length = 88
target-version = ["py311"]

# Isort
[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["backend"]

[tool.coverage.run]
omit = [
    "*/__init__.py",
    "alembic/*",
    "src/config/*",
    "src/core/*",
    "src/scripts/*",
    "src/external_services/*",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
