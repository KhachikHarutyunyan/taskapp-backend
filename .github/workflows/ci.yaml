name: CI - Build, Test & Security Scan Backend

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (stage or prod)"
        required: true
        default: "stage"
        type: environment
      image_tag:
        description: "Docker image tag (SHA) to deploy"
        required: true

env:
  REGISTRY: ghcr.io
  GITOPS_REPO: KhachikHarutyunyan/taskapp
  PYTHON_VERSION: "3.12" 

permissions:
  contents: read
  security-events: write

jobs:
  # ==========================================
  # Testing
  # ==========================================
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry==2.1.3

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --no-root

      - name: Setup test environment
        run: cp tests/.env.test .env

      - name: Run tests
        run: .venv/bin/pytest -c tests/pytest.ini --rootdir=.
    

  # ==========================================
  # Security
  # ==========================================
  security:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Security Tools
        run: pip install 'bandit[toml,sarif]' pip-audit poetry==2.1.3 poetry-plugin-export

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Bandit (SAST)
        run: |
          bandit -r src/ -ll -f sarif -o bandit.sarif || true
          
      - name: Upload Bandit SARIF
        if: always() && hashFiles('bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif

      - name: Export requirements
        run: poetry export -f requirements.txt --without-hashes -o requirements.txt

      - name: Run pip-audit (SCA)
        run: |
          pip-audit -r requirements.txt --strict

  # ==========================================
  # Build and Push
  # ==========================================
  build-scan-push:
    needs: [test, security]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.security.result == 'success' || needs.security.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/task-backend" >> $GITHUB_ENV

      - name: Set deployment variables
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TARGET_ENV=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
            echo "TARGET_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
            echo "DO_BUILD=false" >> $GITHUB_ENV
          else
            echo "TARGET_ENV=dev" >> $GITHUB_ENV
            echo "TARGET_TAG=${{ github.sha }}" >> $GITHUB_ENV
            echo "DO_BUILD=true" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (Load to local)
        if: env.DO_BUILD == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TARGET_TAG }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Run Trivy vulnerability scanner
        if: env.DO_BUILD == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TARGET_TAG }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always() && env.DO_BUILD == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Login to GitHub Container Registry
        if: env.DO_BUILD == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: env.DO_BUILD == 'true'
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TARGET_TAG }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TARGET_TAG }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Checkout GitOps repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GHCR_PAT }}
          path: gitops-repo
          ref: main

      - name: Install yq
        if: github.event_name != 'pull_request'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tag in GitOps values
        if: github.event_name != 'pull_request'
        run: |
          cd gitops-repo
          VALUES_FILE="environments/${{ env.TARGET_ENV }}/backend-values.yaml"

          if [ ! -f "$VALUES_FILE" ]; then
            echo "Error: $VALUES_FILE not found!"
            exit 1
          fi

          yq eval ".image.tag = \"${{ env.TARGET_TAG }}\"" -i "$VALUES_FILE"
          echo "Updated image tag to ${{ env.TARGET_TAG }} in $VALUES_FILE"

      - name: Commit and push changes
        if: github.event_name != 'pull_request'
        run: |
          cd gitops-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          VALUES_FILE="environments/${{ env.TARGET_ENV }}/backend-values.yaml"
          git add "$VALUES_FILE"
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci(${{ env.TARGET_ENV }}): deploy backend ${{ env.TARGET_TAG }} [skip ci]"
            git push origin main
          fi