name: CI - Build and Push Backend Image

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (stage or prod)"
        required: true
        default: "stage"
        type: environment
        oprions:
          - stage
          - prod
      image_tag:
        description: "Docker image tag (SHA) to deploy"
        required: true

env:
  REGISTRY: ghcr.io
  GITOPS_REPO: KhachikHarutyunyan/taskapp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    # Important to push in GHCR with GITHUB_TOKEN
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/task-backend" >> $GITHUB_ENV

      - name: Set deployment variables
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TARGET_ENV=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
            echo "TARGET_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
            echo "DO_BUILD=false" >> $GITHUB_ENV
          else
            echo "TARGET_ENV=dev" >> $GITHUB_ENV
            echo "TARGET_TAG=${{ github.sha }}" >> $GITHUB_ENV
            echo "DO_BUILD=true" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # Auth in GHCR with GITHUB_TOKEN
      # Builds only if push DO_BUILD=true
      - name: Build and push Docker image
        if: env.DO_BUILD == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nginx/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      # Checkout GitOps-repository (only if push)
      - name: Checkout GitOps repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GHCR_PAT }}   # PAT with permission to write in taskapp
          path: gitops-repo
          ref: main

      # Install yq
      - name: Install yq
        if: github.event_name != 'pull_request'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # Update tag in values-file
      - name: Update image tag in GitOps values
        if: github.event_name != 'pull_request'
        run: |
          cd gitops-repo
          VALUES_FILE="environments/${{ env.TARGET_ENV }}/backend-values.yaml"

          # Check file exists
          if [ ! -f "$VALUES_FILE" ]; then
            echo "Error: $VALUES_FILE not found!"
            exit 1
          fi

          yq eval ".image.tag = \"${{ env.TARGET_TAG }}\"" -i "$VALUES_FILE"
          echo "Updated image tag to ${{ env.TARGET_TAG }} in $VALUES_FILE"

      # Commit and push to GitOps-repository
      - name: Commit and push changes
        if: github.event_name != 'pull_request'
        run: |
          cd gitops-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          VALUES_FILE="environments/${{ env.TARGET_ENV }}/backend-values.yaml"
          git add "$VALUES_FILE"
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci(${{ env.TARGET_ENV }}): deploy backend ${{ env.TARGET_TAG }} [skip ci]"
            git push origin main
          fi